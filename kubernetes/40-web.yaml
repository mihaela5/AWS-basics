apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudshirt-web
  namespace: cloudshirt
  labels:
    app.kubernetes.io/name: cloudshirt-web
    app.kubernetes.io/part-of: cloudshirt
    app.kubernetes.io/component: web
spec:
  replicas: 5
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudshirt-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudshirt-web
        app.kubernetes.io/part-of: cloudshirt
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudshirt-web
      initContainers:
        - name: wait-for-database
          image: __WEB_IMAGE__
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              until (echo > /dev/tcp/cloudshirt-sql/1433) 2>/dev/null; do
                echo "waiting for CloudShirt database"
                sleep 5
              done
        - name: wait-for-api
          image: __WEB_IMAGE__
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              until (echo > /dev/tcp/cloudshirt-api/8080) 2>/dev/null; do
                echo "waiting for CloudShirt API"
                sleep 5
              done
      containers:
        - name: web
          image: __WEB_IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cloudshirt-config
          env:
            - name: ConnectionStrings__CatalogConnection
              valueFrom:
                secretKeyRef:
                  name: cloudshirt-db
                  key: CatalogConnection
            - name: ConnectionStrings__IdentityConnection
              valueFrom:
                secretKeyRef:
                  name: cloudshirt-db
                  key: IdentityConnection
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api_health_check
              port: http
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api_health_check
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cloudshirt-web
  namespace: cloudshirt
  labels:
    app.kubernetes.io/name: cloudshirt-web
    app.kubernetes.io/part-of: cloudshirt
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  selector:
    app.kubernetes.io/name: cloudshirt-web
  ports:
    - name: http
      port: 80
      targetPort: http
