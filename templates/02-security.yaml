Description: Security groups for the CloudShirt environment.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where security groups will be created

Resources:
  # Security group for the ALB
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic from the internet to the Application Load Balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: CloudShirtLoadBalancerSecurityGroup


  # Security group for the CloudShirt web servers.
  # Web servers only accept HTTP traffic coming from the Load Balancer.
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic from the Application Load Balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

        # Temporary direct access for testing the basic EC2 deployment
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: Allow SSH for administration

      Tags:
        - Key: Name
          Value: CloudShirtWebServerSecurityGroup

  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow NFS traffic from Web Server instances to EFS mount targets
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref WebServerSecurityGroup
      Tags:
        - Key: Name
          Value: CloudShirtEFSSecurityGroup

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SQL Server traffic from Web Server instances
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1433
          ToPort: 1433
          SourceSecurityGroupId: !Ref WebServerSecurityGroup
      Tags:
        - Key: Name
          Value: CloudShirtDBSecurityGroup

  # Buildserver in the private subnet. It accepts SSH only from the web
  # servers, which act as the jump host. Day-to-day access goes through SSM
  # Session Manager, which needs no inbound rule at all. All outbound traffic
  # is allowed so the instance can reach GitHub and ECR through the NAT gateway.
  BuildserverSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH to the Buildserver from the web servers (jump host) only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref WebServerSecurityGroup
          Description: SSH from the web servers, which act as the jump host
      Tags:
        - Key: Name
          Value: CloudShirtBuildserverSecurityGroup

  MonitoringSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Filebeat from Web Servers (9200) and Kibana access for Admins (5601)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9200
          ToPort: 9200
          SourceSecurityGroupId: !Ref WebServerSecurityGroup
          Description: Elasticsearch API ingestion from web fleet Filebeat
        - IpProtocol: tcp
          FromPort: 5601
          ToPort: 5601
          CidrIp: 0.0.0.0/0
          Description: Kibana dashboard access for administrators
      Tags:
        - Key: Name
          Value: CloudShirtMonitoringSecurityGroup


Outputs:

  LoadBalancerSecurityGroupRef:
    Description: Reference to the Load Balancer security group.
    Value: !Ref LoadBalancerSecurityGroup
    Export:
      Name: !Join [ ":", [ !Ref "AWS::StackName", LoadBalancerSecurityGroup ] ]


  WebServerSecurityGroupRef:
    Description: Reference to the web server security group.
    Value: !Ref WebServerSecurityGroup
    Export:
      Name: !Join [ ":", [ !Ref "AWS::StackName", WebServerSecurityGroup ] ]

  EFSSecurityGroupRef:
    Description: Reference to the EFS security group.
    Value: !Ref EFSSecurityGroup
    Export:
      Name: !Join [ ":", [ !Ref "AWS::StackName", EFSSecurityGroup ] ]

  DBSecurityGroupRef:
    Description: Reference to the RDS database security group.
    Value: !Ref DBSecurityGroup
    Export:
      Name: !Join [ ":", [ !Ref "AWS::StackName", DBSecurityGroup ] ]

  MonitoringSecurityGroupRef:
    Description: Reference to the monitoring security group.
    Value: !Ref MonitoringSecurityGroup
    Export:
      Name: !Join [ ":", [ !Ref "AWS::StackName", MonitoringSecurityGroup ] ]

  BuildserverSecurityGroupRef:
    Description: Reference to the Buildserver security group.
    Value: !Ref BuildserverSecurityGroup
    Export:
      Name: !Join [ ":", [ !Ref "AWS::StackName", BuildserverSecurityGroup ] ]