AWSTemplateFormatVersion: "2010-09-09"

Description: CloudShirt application running on an EC2 instance connected to EFS and RDS.


Parameters:

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the CloudShirt application is deployed

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: First public subnet for application instances and ALB

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Second public subnet for application instances and ALB

  WebServerSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group used by the CloudShirt web servers

  LoadBalancerSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group used by the Application Load Balancer

  FileSystemId:
    Type: String
    Description: EFS filesystem used for CloudShirt logs

  DBEndpoint:
    Type: String
    Description: RDS SQL Server endpoint

  DBPort:
    Type: String
    Default: "1433"
    Description: RDS SQL Server port

  DBUsername:
    Type: String
    Description: RDS SQL Server username
    NoEcho: true

  DBPassword:
    Type: String
    Description: RDS SQL Server password
    NoEcho: true

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 KeyPair used for administration

  UserDataScriptUrl:
    Type: String
    Description: URL of the CloudShirt EC2 userdata script

  ElasticsearchPrivateIP:
    Type: String
    Description: Private IP address of the Elastic Stack monitoring instance

  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: >
      Existing instance profile for the web servers. AWS Academy Learner Lab
      does not allow custom IAM roles, so LabInstanceProfile is the default.
      Leave this empty to create a least-privilege role with ECR pull and SSM
      parameter read access.

  SwarmManagerIpParameterName:
    Type: String
    Description: SSM parameter holding the Swarm manager private IP

  SwarmWorkerTokenParameterName:
    Type: String
    Description: SSM SecureString parameter holding the worker join token

Conditions:
  CreateInstanceProfile: !Equals [!Ref InstanceProfileName, ""]

Resources:

  # Created only when InstanceProfileName is empty.
  WebServerRole:
    Type: AWS::IAM::Role
    Condition: CreateInstanceProfile
    Properties:
      RoleName: CloudShirtWebServerRole
      Description: CloudShirt web servers - Swarm workers and ECR pull
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
      Policies:
        - PolicyName: CloudShirtWebServerSwarmWorker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SwarmManagerIpParameterName}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SwarmWorkerTokenParameterName}"
      Tags:
        - Key: Name
          Value: CloudShirtWebServerRole

  WebServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: CreateInstanceProfile
    Properties:
      InstanceProfileName: CloudShirtWebServerInstanceProfile
      Roles:
        - !Ref WebServerRole

  # Launch Template used by the Auto Scaling Group to create
  # CloudShirt application instances.
  CloudShirtLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: CloudShirtLaunchTemplate

      LaunchTemplateData:
        ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
        InstanceType: t3.micro
        KeyName: !Ref KeyName
        
        IamInstanceProfile:
          Name: !If [CreateInstanceProfile, !Ref WebServerInstanceProfile, !Ref InstanceProfileName]

        SecurityGroupIds:
          - !Ref WebServerSecurityGroupId

        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail

            export FILE_SYSTEM_ID="${FileSystemId}"
            export DB_ENDPOINT="${DBEndpoint}"
            export DB_PORT="${DBPort}"
            export DB_USERNAME="${DBUsername}"
            export DB_PASSWORD="${DBPassword}"
            export ELASTICSEARCH_PRIVATE_IP="${ElasticsearchPrivateIP}"
            export AWS_DEFAULT_REGION="${AWS::Region}"

            # Docker Swarm worker
            dnf install -y docker awscli-2
            systemctl enable --now docker
            until docker info >/dev/null 2>&1; do
              sleep 2
            done

            if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" != "active" ]; then
              MANAGER_IP=""
              JOIN_TOKEN=""
              for attempt in $(seq 1 60); do
                # The Buildserver publishes both parameters from its own
                # UserData, which may still be running: retry until it does.
                if MANAGER_IP="$(aws ssm get-parameter \
                      --name "${SwarmManagerIpParameterName}" \
                      --query Parameter.Value --output text 2>/dev/null)" \
                   && JOIN_TOKEN="$(aws ssm get-parameter \
                      --name "${SwarmWorkerTokenParameterName}" \
                      --with-decryption \
                      --query Parameter.Value --output text 2>/dev/null)"; then
                  if docker swarm join --token "$JOIN_TOKEN" "$MANAGER_IP:2377"; then
                    break
                  fi
                fi

                if [ "$attempt" -eq 60 ]; then
                  echo "ERROR: could not join the Swarm after 60 attempts. Check that the instance profile allows ssm:GetParameter on ${SwarmManagerIpParameterName} and ${SwarmWorkerTokenParameterName}, and that the Buildserver published them." >&2
                  exit 1
                fi

                echo "Swarm manager not ready (attempt $attempt/60); retrying in 10 seconds..."
                sleep 10
              done
              unset JOIN_TOKEN
            fi

            docker info --format 'Swarm state: {{.Swarm.LocalNodeState}}'

            # Application
            curl -fsSL "${UserDataScriptUrl}" -o /tmp/userdata.sh
            chmod +x /tmp/userdata.sh
            /tmp/userdata.sh

        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: CloudShirtWebServer

  # 2. Application Load Balancer
  # Distributes incoming HTTP traffic across both availability zones.
  CloudShirtLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: CloudShirtALB

      Scheme: internet-facing

      Type: application

      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

      SecurityGroups:
        - !Ref LoadBalancerSecurityGroupId

      Tags:
        - Key: Name
          Value: CloudShirtALB
 # Target group forwards HTTP traffic from the ALB to CloudShirt.
  CloudShirtTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: CloudShirtTargetGroup

      VpcId: !Ref VpcId

      Protocol: HTTP
      Port: 80

      TargetType: instance

      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  # 4. HTTP Listener
  # Forwards requests from the ALB to the target group.
  CloudShirtListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:

      LoadBalancerArn: !Ref CloudShirtLoadBalancer

      Protocol: HTTP
      Port: 80

      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref CloudShirtTargetGroup

  # 5. Auto Scaling Group
  # Maintains at least two instances across two availability zones.
  CloudShirtAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: "2"
      MaxSize: "4"
      DesiredCapacity: "2"

      VPCZoneIdentifier:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

      LaunchTemplate:
        LaunchTemplateId: !Ref CloudShirtLaunchTemplate
        Version: !GetAtt CloudShirtLaunchTemplate.LatestVersionNumber

      TargetGroupARNs:
        - !Ref CloudShirtTargetGroup

      HealthCheckType: ELB
      # Above the worst-case bootstrap: Docker install, up to 10 minutes of Swarm join retries, and the existing dotnet publish.
      HealthCheckGracePeriod: 1200

      Tags:
        - Key: Name
          Value: CloudShirtWebServer
          PropagateAtLaunch: true

  # 6. Scheduled Scale-Out
  # Increase desired capacity to four instances at 18:00 Eastern Time.
  CloudShirtScaleOut:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !Ref CloudShirtAutoScalingGroup
      Recurrence: "0 18 * * *"
      TimeZone: America/New_York

      MinSize: "2"
      MaxSize: "4"
      DesiredCapacity: "4"

  # 7. Scheduled Scale-In
  # Return to two instances at 20:00 Eastern Time.
  CloudShirtScaleIn:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !Ref CloudShirtAutoScalingGroup
      Recurrence: "0 20 * * *"
      TimeZone: America/New_York

      MinSize: "2"
      MaxSize: "4"
      DesiredCapacity: "2"

Outputs:

  LoadBalancerDNS:
    Description: DNS name used to access the CloudShirt application
    Value: !GetAtt CloudShirtLoadBalancer.DNSName

  TargetGroupArn:
    Description: ARN of the CloudShirt target group
    Value: !Ref CloudShirtTargetGroup

  LaunchTemplateId:
    Description: ID of the CloudShirt EC2 Launch Template
    Value: !Ref CloudShirtLaunchTemplate

  AutoScalingGroupName:
    Description: Name of the CloudShirt Auto Scaling Group
    Value: !Ref CloudShirtAutoScalingGroup

  LoadBalancerFullName:
    Description: Full name of the CloudShirt Load Balancer
    Value: !GetAtt CloudShirtLoadBalancer.LoadBalancerFullName

  TargetGroupFullName:
    Description: Full name of the CloudShirt Target Group
    Value: !GetAtt CloudShirtTargetGroup.TargetGroupFullName
