AWSTemplateFormatVersion: "2010-09-09"

Description: CloudShirt application running on an EC2 instance connected to EFS and RDS.


Parameters:

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the CloudShirt application is deployed

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: First public subnet for application instances and ALB

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Second public subnet for application instances and ALB

  WebServerSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group used by the CloudShirt web servers

  LoadBalancerSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group used by the Application Load Balancer

  FileSystemId:
    Type: String
    Description: EFS filesystem used for CloudShirt logs

  DBEndpoint:
    Type: String
    Description: RDS SQL Server endpoint

  DBPort:
    Type: String
    Default: "1433"
    Description: RDS SQL Server port

  DBUsername:
    Type: String
    Description: RDS SQL Server username
    NoEcho: true

  DBPassword:
    Type: String
    Description: RDS SQL Server password
    NoEcho: true

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 KeyPair used for administration

  UserDataScriptUrl:
    Type: String
    Description: URL of the CloudShirt EC2 userdata script

  ElasticsearchPrivateIP:
    Type: String
    Description: Private IP address of the Elastic Stack monitoring instance


Resources:

  # Launch Template used by the Auto Scaling Group to create
  # CloudShirt application instances.
  CloudShirtLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: CloudShirtLaunchTemplate

      LaunchTemplateData:
        ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
        InstanceType: t3.micro
        KeyName: !Ref KeyName

        SecurityGroupIds:
          - !Ref WebServerSecurityGroupId

        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -e

            export FILE_SYSTEM_ID="${FileSystemId}"
            export DB_ENDPOINT="${DBEndpoint}"
            export DB_PORT="${DBPort}"
            export DB_USERNAME="${DBUsername}"
            export DB_PASSWORD="${DBPassword}"
            export ELASTICSEARCH_PRIVATE_IP="${ElasticsearchPrivateIP}"

            curl -fsSL "${UserDataScriptUrl}" -o /tmp/userdata.sh
            chmod +x /tmp/userdata.sh
            /tmp/userdata.sh

        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: CloudShirtWebServer

  # 2. Application Load Balancer
  # Distributes incoming HTTP traffic across both availability zones.
  CloudShirtLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: CloudShirtALB

      Scheme: internet-facing

      Type: application

      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

      SecurityGroups:
        - !Ref LoadBalancerSecurityGroupId

      Tags:
        - Key: Name
          Value: CloudShirtALB
 # Target group forwards HTTP traffic from the ALB to CloudShirt.
  CloudShirtTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: CloudShirtTargetGroup

      VpcId: !Ref VpcId

      Protocol: HTTP
      Port: 80

      TargetType: instance

      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  # 4. HTTP Listener
  # Forwards requests from the ALB to the target group.
  CloudShirtListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:

      LoadBalancerArn: !Ref CloudShirtLoadBalancer

      Protocol: HTTP
      Port: 80

      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref CloudShirtTargetGroup

  # 5. Auto Scaling Group
  # Maintains at least two instances across two availability zones.
  CloudShirtAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: "2"
      MaxSize: "4"
      DesiredCapacity: "2"

      VPCZoneIdentifier:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

      LaunchTemplate:
        LaunchTemplateId: !Ref CloudShirtLaunchTemplate
        Version: !GetAtt CloudShirtLaunchTemplate.LatestVersionNumber

      TargetGroupARNs:
        - !Ref CloudShirtTargetGroup

      HealthCheckType: ELB
      HealthCheckGracePeriod: 600

      Tags:
        - Key: Name
          Value: CloudShirtWebServer
          PropagateAtLaunch: true

  # 6. Scheduled Scale-Out
  # Increase desired capacity to four instances at 18:00 Eastern Time.
  CloudShirtScaleOut:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !Ref CloudShirtAutoScalingGroup
      Recurrence: "0 18 * * *"
      TimeZone: America/New_York

      MinSize: "2"
      MaxSize: "4"
      DesiredCapacity: "4"

  # 7. Scheduled Scale-In
  # Return to two instances at 20:00 Eastern Time.
  CloudShirtScaleIn:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !Ref CloudShirtAutoScalingGroup
      Recurrence: "0 20 * * *"
      TimeZone: America/New_York

      MinSize: "2"
      MaxSize: "4"
      DesiredCapacity: "2"

Outputs:

  LoadBalancerDNS:
    Description: DNS name used to access the CloudShirt application
    Value: !GetAtt CloudShirtLoadBalancer.DNSName

  TargetGroupArn:
    Description: ARN of the CloudShirt target group
    Value: !Ref CloudShirtTargetGroup

  LaunchTemplateId:
    Description: ID of the CloudShirt EC2 Launch Template
    Value: !Ref CloudShirtLaunchTemplate

  AutoScalingGroupName:
    Description: Name of the CloudShirt Auto Scaling Group
    Value: !Ref CloudShirtAutoScalingGroup
