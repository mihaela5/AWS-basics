AWSTemplateFormatVersion: '2010-09-09'
Description: Master Root Stack orchestrating CloudShirt AWS Basics infrastructure.

Parameters:
  
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 KeyPair for SSH administration
    Default: vockey

  BuildserverInstanceProfile:
    Type: String
    Default: LabInstanceProfile
    Description: >
      Existing EC2 instance profile for the Buildserver. AWS Academy Learner
      Lab does not allow custom IAM roles, so LabInstanceProfile is the
      default. Pass an empty value to let the Buildserver stack create a
      least-privilege role with ECR push/pull and SSM Session Manager access.

  WebServerInstanceProfile:
    Type: String
    Default: LabInstanceProfile
    Description: >
      Existing EC2 instance profile for the web servers. AWS Academy Learner
      Lab does not allow custom IAM roles, so LabInstanceProfile is the
      default. Pass an empty value to let the application stack create a
      least-privilege role with ECR pull and Swarm parameter read access.

  ImageRetentionCount:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: Number of Docker images kept in the CloudShirt ECR repository

  DBUsername:
    Type: String
    Default: cloudshirtadmin
    NoEcho: true
    
  DBPassword:
    Type: String
    Default: ChangeMe123!
    NoEcho: true

  UserDataScriptUrl:
    Type: String
    Description: URL of the CloudShirt EC2 userdata script

  AlarmEmail:
    Type: String
    Default: ""
    Description: Email address that receives CloudWatch alarm notifications (optional)

Resources:
    # 1. Base Networking (VPCs, Subnets across AZ A & AZ B, Route Tables)
  NetworkingStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./01-networking.yaml

  SecurityStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: NetworkingStack
    Properties:
      TemplateURL: ./02-security.yaml
      Parameters:
        VpcId: !GetAtt NetworkingStack.Outputs.VPCRef

  BuildserverStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: [NetworkingStack, SecurityStack]
    Properties:
      TemplateURL: ./09-buildserver.yaml
      Parameters:
        PrivateSubnetId: !GetAtt NetworkingStack.Outputs.PrivateSubnet1Ref
        BuildserverSecurityGroupId: !GetAtt SecurityStack.Outputs.BuildserverSecurityGroupRef
        KeyName: !Ref KeyName
        InstanceProfileName: !Ref BuildserverInstanceProfile

  EcrStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./10-ecr.yaml
      Parameters:
        ImageRetentionCount: !Ref ImageRetentionCount

  StorageStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: [NetworkingStack, SecurityStack]
    Properties:
      TemplateURL: ./03-storage.yaml
      Parameters:
        PublicSubnet1: !GetAtt NetworkingStack.Outputs.PublicSubnet1Ref
        PublicSubnet2: !GetAtt NetworkingStack.Outputs.PublicSubnet2Ref
        EFSSecurityGroupId: !GetAtt SecurityStack.Outputs.EFSSecurityGroupRef

  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: [NetworkingStack, SecurityStack]
    Properties:
      TemplateURL: ./04-database.yaml
      Parameters:
        PrivateSubnet1: !GetAtt NetworkingStack.Outputs.PrivateSubnet1Ref
        PrivateSubnet2: !GetAtt NetworkingStack.Outputs.PrivateSubnet2Ref
        DBSecurityGroupId: !GetAtt SecurityStack.Outputs.DBSecurityGroupRef
        DBUsername: !Ref DBUsername
        DBPassword: !Ref DBPassword

  # DependsOn BuildserverStack makes the manager stack finish first.
  ApplicationStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: [NetworkingStack, SecurityStack, BuildserverStack, StorageStack, DatabaseStack, MonitoringStack]
    Properties:
      TemplateURL: ./05-application.yaml
      Parameters:
        VpcId: !GetAtt NetworkingStack.Outputs.VPCRef
        PublicSubnet1: !GetAtt NetworkingStack.Outputs.PublicSubnet1Ref
        PublicSubnet2: !GetAtt NetworkingStack.Outputs.PublicSubnet2Ref
        WebServerSecurityGroupId: !GetAtt SecurityStack.Outputs.WebServerSecurityGroupRef
        LoadBalancerSecurityGroupId: !GetAtt SecurityStack.Outputs.LoadBalancerSecurityGroupRef
        FileSystemId: !GetAtt StorageStack.Outputs.FileSystemId
        DBEndpoint: !GetAtt DatabaseStack.Outputs.DBEndpoint
        DBPort: !GetAtt DatabaseStack.Outputs.DBPort
        DBUsername: !Ref DBUsername
        DBPassword: !Ref DBPassword
        ElasticsearchPrivateIP: !GetAtt MonitoringStack.Outputs.ElasticsearchPrivateIP
        KeyName: !Ref KeyName
        UserDataScriptUrl: !Ref UserDataScriptUrl
        InstanceProfileName: !Ref WebServerInstanceProfile
        SwarmManagerIpParameterName: !GetAtt BuildserverStack.Outputs.SwarmManagerIpParameterName
        SwarmWorkerTokenParameterName: !GetAtt BuildserverStack.Outputs.SwarmWorkerTokenParameterName

  MonitoringStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: [NetworkingStack, SecurityStack]
    Properties:
      TemplateURL: ./06-monitoring.yaml
      Parameters:
        VpcId: !GetAtt NetworkingStack.Outputs.VPCRef
        SubnetId: !GetAtt NetworkingStack.Outputs.PublicSubnet1Ref
        MonitoringSecurityGroupId: !GetAtt SecurityStack.Outputs.MonitoringSecurityGroupRef
        KeyName: !Ref KeyName

  ServerlessStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: [NetworkingStack, StorageStack]
    Properties:
      TemplateURL: ./07-serverless.yaml
      Parameters:
        OrderExportBucketName: !GetAtt StorageStack.Outputs.S3BucketName
        OrderExportBucketArn: !GetAtt StorageStack.Outputs.S3BucketArn
        DeploymentVersion: "1"

  CloudwatchStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: ApplicationStack
    Properties:
      TemplateURL: ./08-cloudwatch.yaml
      Parameters:
        AutoScalingGroupName: !GetAtt ApplicationStack.Outputs.AutoScalingGroupName
        LoadBalancerFullName: !GetAtt ApplicationStack.Outputs.LoadBalancerFullName
        TargetGroupFullName: !GetAtt ApplicationStack.Outputs.TargetGroupFullName
        AlarmEmail: !Ref AlarmEmail

Outputs:
  NetworkingStackOutput:
    Description: "Networking Stack ID"
    Value: !Ref NetworkingStack

  SecurityStackOutput:
    Description: "Security Stack ID"
    Value: !Ref SecurityStack

  BuildserverStackOutput:
    Description: "Buildserver Stack ID"
    Value: !Ref BuildserverStack

  BuildserverInstanceId:
    Description: "Instance ID of the CloudShirt Buildserver"
    Value: !GetAtt BuildserverStack.Outputs.InstanceId

  BuildserverPrivateIp:
    Description: "Private IP address of the CloudShirt Buildserver"
    Value: !GetAtt BuildserverStack.Outputs.PrivateIp

  EcrStackOutput:
    Description: "ECR Stack ID"
    Value: !Ref EcrStack

  EcrRepositoryName:
    Description: "Name of the CloudShirt ECR repository"
    Value: !GetAtt EcrStack.Outputs.RepositoryName

  EcrRepositoryUri:
    Description: "URI used to tag and push CloudShirt images"
    Value: !GetAtt EcrStack.Outputs.RepositoryUri

  StorageStackOutput:
    Description: "Storage Stack ID"
    Value: !Ref StorageStack

  DatabaseStackOutput:
    Description: "Database Stack ID"
    Value: !Ref DatabaseStack

  ApplicationStackOutput:
    Description: "Application Stack ID"
    Value: !Ref ApplicationStack

  AutoScalingGroupName:
    Description: "Name of the CloudShirt Auto Scaling Group (for scaling and instance refresh)"
    Value: !GetAtt ApplicationStack.Outputs.AutoScalingGroupName

  MonitoringStackOutput:
    Description: "Monitoring Stack ID"
    Value: !Ref MonitoringStack

  ServerlessStackOutput:
    Description: "Serverless Stack ID"
    Value: !Ref ServerlessStack

  CloudwatchStackOutput:
    Description: "Cloudwatch Stack ID"
    Value: !Ref CloudwatchStack

  OrderInsightsApiEndpoint:
    Description: "Invoke URL of the CloudShirt order insights API"
    Value: !GetAtt ServerlessStack.Outputs.ApiEndpoint

  OrderExportBucketName:
    Description: "S3 bucket holding the order exports"
    Value: !GetAtt StorageStack.Outputs.S3BucketName
